services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: central_chamados
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_chamados"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/central_chamados
      DB_USERNAME: central
      DB_PASSWORD: central
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-at-least-32-characters-long}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  postgres_data:
