spring:
  application:
    name: central-chamados-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/central_chamados}
    username: ${DB_USERNAME:central}
    password: ${DB_PASSWORD:central}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  alert:
    minutes-previsao: ${ALERTA_MINUTOS_PREVISAO:60}
    minutes-sem-atendimento: ${ALERTA_MINUTOS_SEM_ATENDIMENTO:30}
  outbox:
    interval-ms: ${OUTBOX_INTERVAL_MS:5000}
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
